name: Import Studigo Mascot Frame

on:
  push:
    branches:
      - assets/cursor-tracking-mascot-frames
    paths:
      - '.github/workflows/import-mascot-frame.yml'

permissions:
  contents: write

jobs:
  import-frame:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: assets/cursor-tracking-mascot-frames

      - name: Download frame
        run: |
          mkdir -p apps/web/public/mascot/cursor-tracking
          curl -fL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3IkKBBXHZvEZQt2d8pBaRYd083T/6684539a-bce8-4c99-a1b1-04ac894f3f63.png' -o 'apps/web/public/mascot/cursor-tracking/studigo-cursor-frame-07-right-near.png'
          file 'apps/web/public/mascot/cursor-tracking/studigo-cursor-frame-07-right-near.png'

      - name: Commit imported frame
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'apps/web/public/mascot/cursor-tracking/studigo-cursor-frame-07-right-near.png'
          git diff --cached --quiet && exit 0
          git commit -m 'assets: add mascot cursor frame 07 right-near'
          git push origin HEAD:assets/cursor-tracking-mascot-frames
