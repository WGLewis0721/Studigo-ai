name: One-time Next.js security update (incident)
on:
  push:
    branches:
      - fix/supabase-middleware-timeout-20261120
    paths:
      - .github/workflows/incident-next-upgrade-once.yml
permissions:
  contents: write
jobs:
  patch-next:
    if: github.repository == 'WGLewis0721/Studigo-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout incident branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned pnpm without lifecycle scripts
        run: npm install --global pnpm@10.0.0 --ignore-scripts
      - name: Update Next.js and lockfile (no lifecycle scripts)
        run: pnpm --filter @studigo/web add next@16.4.1 --save-exact --ignore-scripts
      - name: Commit scoped dependency fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'Already patched'
            exit 0
          fi
          git commit -m 'fix(deps): patch Next.js critical security advisories'
          git push origin HEAD:refs/heads/fix/supabase-middleware-timeout-20261120
      - name: Verify production dependency audit
        run: pnpm audit --prod --audit-level high
