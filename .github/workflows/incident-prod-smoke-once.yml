name: One-time Studigo production smoke (incident)
on:
  push:
    branches:
      - fix/supabase-middleware-timeout-20261120
    paths:
      - .github/workflows/incident-prod-smoke-once.yml
permissions: {}
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Test actual production HTTP routes (read-only)
        shell: bash
        run: |
          set -euo pipefail
          base="https://studigo-ai.vercel.app"
          for path in / /login /signup /api/health; do
            code=$(curl -sS --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 \
              -o /tmp/studigo-body -w '%{http_code}' "$base$path")
            echo "$path HTTP $code"
            test "$code" = "200"
            if [ "$path" = "/api/health" ]; then
              grep -q '"ok":true' /tmp/studigo-body
              grep -q '"service":"studigo-web"' /tmp/studigo-body
            fi
          done
          code=$(curl -sS --retry 3 --connect-timeout 10 --max-time 30 \
            -D /tmp/studigo-auth-headers -o /dev/null -w '%{http_code}' "$base/app")
          echo "/app (signed out) HTTP $code"
          case "$code" in 301|302|303|307|308) ;; *) echo "Protected route did not redirect" >&2; exit 1;; esac
          grep -qi '^location: .*\/login' /tmp/studigo-auth-headers
          echo "All public and unauthenticated route checks passed"
