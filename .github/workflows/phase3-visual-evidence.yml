name: Phase 3 visual evidence
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/app/**"
      - "apps/web/components/**"
      - "apps/web/lib/phase3-room-flag*"
      - ".github/workflows/phase3-visual-evidence.yml"
      - "scripts/phase3-visual-qa.mjs"
      - "scripts/home-marketing-qa.mjs"
      - "scripts/v1-mobile-tabbar-qa.mjs"
      - "scripts/mobile-room-chrome-qa.mjs"
      - "scripts/v1-final-qa.mjs"
      - "scripts/v1-webkit-smoke.mjs"
      - "scripts/v3-practice-qa.mjs"
      - "scripts/v4-progress-plan-qa.mjs"
      - "scripts/v5-home-onboarding-qa.mjs"
      - "scripts/v5-shell-settings-auth-qa.mjs"
      - "scripts/v6-cross-device-parity-qa.mjs"
      - "scripts/messenger-unity-qa.mjs"
      - "scripts/desktop-mode-drawer-qa.mjs"
      - "scripts/capture-golden-2026-10-18-public.mjs"

permissions:
  contents: read

jobs:
  synthetic-four-width:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install packages
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and WebKit
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Install PDF inspector for real print assertions
        run: python3 -m pip install --disable-pip-version-check pymupdf
      - name: Start local synthetic fixture
        run: |
          NEXT_PUBLIC_STUDIGO_PHASE3_FOUNDATION_UI=1 pnpm --filter @studigo/web dev --hostname 127.0.0.1 -p 3000 >/tmp/studigo-phase3-dev.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent --output /dev/null 'http://127.0.0.1:3000/dev/study?mode=coach&ui=phase3'; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/studigo-phase3-dev.log
          exit 1
      - name: V1 mobile dock — scroll, modal, keyboard and reduced motion
        run: node scripts/v1-mobile-tabbar-qa.mjs
      - name: Mobile room chrome — page headers and scroll position
        run: node scripts/mobile-room-chrome-qa.mjs
      - name: V1 — focus, empty states and four-width zoom/reflow
        run: node scripts/v1-final-qa.mjs
      - name: V1 — WebKit engine phone/tablet keyboard focus and touch smoke
        run: node scripts/v1-webkit-smoke.mjs
      - name: V3 — Coach and Practice interactions at four widths
        run: node scripts/v3-practice-qa.mjs
      - name: V4 — saved evidence and plan action routing
        run: node scripts/v4-progress-plan-qa.mjs
      - name: V5 — Home, room entry and first-run across four widths
        run: node scripts/v5-home-onboarding-qa.mjs
      - name: V5 — signed-in shell fixture, room settings and public auth parity
        run: node scripts/v5-shell-settings-auth-qa.mjs
      - name: V6 — same-fixture cross-device mode parity and text reflow
        run: node scripts/v6-cross-device-parity-qa.mjs
      - name: Messenger — shared mobile/desktop layout with speech and text
        run: node scripts/messenger-unity-qa.mjs
      - name: Desktop mode drawer — idle, page colors and bounce
        run: node scripts/desktop-mode-drawer-qa.mjs
      - name: Homepage — live Explore component and iPad demo at four widths
        run: node scripts/home-marketing-qa.mjs
      - name: Capture legacy vs Phase 3 screenshots and overflow report
        run: node scripts/phase3-visual-qa.mjs
      - name: Capture production public golden pages
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/v0-golden-baseline-20261017'
        run: node scripts/capture-golden-public.mjs
      - name: Capture frozen 2026-10-18 production public pages
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/v5-v6-golden-capture-20261018'
        run: node scripts/capture-golden-2026-10-18-public.mjs
      - name: Upload evidence even when checks fail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-visual-evidence
          path: artifacts/phase3-visual
          if-no-files-found: warn
          retention-days: ${{ (github.head_ref == 'chore/v0-golden-baseline-20261017' || github.head_ref == 'chore/v5-v6-golden-capture-20261018') && 90 || 14 }}
