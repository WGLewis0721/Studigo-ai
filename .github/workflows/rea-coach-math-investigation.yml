name: REA Coach Math Research (temporary)

on:
  pull_request:
    paths:
      - '.github/workflows/rea-coach-math-investigation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rea-static-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch only public reference source
        run: |
          git clone --depth 1 https://github.com/google/mathsteps.git /tmp/rea-mathsteps
          git clone --depth 1 https://github.com/filipdomkc/FormulaDecoder.git /tmp/rea-formuladecoder
          echo "mathsteps_sha=$(git -C /tmp/rea-mathsteps rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo "formuladecoder_sha=$(git -C /tmp/rea-formuladecoder rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Execute real REA 6.7.0 CLI on JavaScript reference targets
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p /tmp/rea-evidence
          node --version
          for spec in "mathsteps:/tmp/rea-mathsteps" "formuladecoder-client:/tmp/rea-formuladecoder/client"; do
            name="${spec%%:*}"
            target="${spec#*:}"
            echo "::group::REA $name"
            echo "REA_TARGET=$name"
            echo "REA_PATH=$target"
            if timeout 240 npx --yes rea-agents@6.7.0 analyze-javascript-application "$target" --json > "/tmp/rea-evidence/$name.json" 2> "/tmp/rea-evidence/$name.stderr"; then
              echo "REA_EXIT=0"
              echo "REA_EVIDENCE_BYTES=$(wc -c < "/tmp/rea-evidence/$name.json")"
              echo "REA_EVIDENCE_SHA256=$(sha256sum "/tmp/rea-evidence/$name.json" | awk '{print $1}')"
              jq -r 'keys | "REA_KEYS=\(.)"' "/tmp/rea-evidence/$name.json" || true
              jq -cn --slurpfile evidence "/tmp/rea-evidence/$name.json" '{source:{kind:"inline",evidence:$evidence[0]},view:{kind:"summary"}}' > "/tmp/rea-evidence/$name-view-input.json"
              if timeout 45 npx --yes rea-agents@6.7.0 inspect-analysis-view "/tmp/rea-evidence/$name-view-input.json" --json > "/tmp/rea-evidence/$name-summary.json" 2> "/tmp/rea-evidence/$name-summary.stderr"; then
                echo "REA_SUMMARY_RESULT:"
                head -c 20000 "/tmp/rea-evidence/$name-summary.json"
                echo
              else
                echo "REA_SUMMARY_FAILED:"
                head -c 1400 "/tmp/rea-evidence/$name-summary.stderr"
                echo
              fi
            else
              echo "REA_FAILED=$?"
              head -c 3500 "/tmp/rea-evidence/$name.stderr"
              echo
            fi
            echo "::endgroup::"
          done
      - name: Trace math rule and input-upload candidate with REA
        shell: bash
        run: |
          set -uo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const item of [
            {name:'mathsteps',seed:{kind:'string',value:'ADD_POLYNOMIAL_TERMS'}},
            {name:'formuladecoder-client',seed:{kind:'string',value:'REACT_APP_API_URL'}}
          ]) {
            const application=JSON.parse(readFileSync(`/tmp/rea-evidence/${item.name}.json`,'utf8'));
            writeFileSync(`/tmp/rea-evidence/${item.name}-trace-input.json`,JSON.stringify({application,seed:item.seed,direction:'both'}));
          }
          NODE
          for name in mathsteps formuladecoder-client; do
            echo "::group::REA feature trace $name"
            if timeout 60 npx --yes rea-agents@6.7.0 trace-application-feature "/tmp/rea-evidence/$name-trace-input.json" --json > "/tmp/rea-evidence/$name-trace.json" 2> "/tmp/rea-evidence/$name-trace.stderr"; then
              echo "REA_TRACE_OK=$name"
              jq -c '{operation,confidence,authority,normalized_result,limitations}' "/tmp/rea-evidence/$name-trace.json" | head -c 14000
              echo
            else
              echo "REA_TRACE_FAILED=$name"
              head -c 1800 "/tmp/rea-evidence/$name-trace.stderr"
              echo
            fi
            echo "::endgroup::"
          done
      - name: Public-only Chegg and Mathway REA browser observations
        shell: bash
        run: |
          set -uo pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "REA_BROWSER_UNAVAILABLE=Chrome not installed"
            exit 0
          fi
          echo "REA_BROWSER_VERSION=$("$browser" --version)"
          for spec in "mathway:https://www.mathway.com/Algebra" "chegg:https://www.chegg.com/study"; do
            name="${spec%%:*}"
            url="${spec#*:}"
            echo "::group::Public REA browser inspection $name"
            "$browser" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --password-store=basic --no-first-run \
              --remote-debugging-port=9222 --user-data-dir="/tmp/rea-$name-profile" "$url" \
              > "/tmp/rea-evidence/$name-chrome.log" 2>&1 &
            chrome_pid=$!
            ready=0
            for n in $(seq 1 20); do
              if curl -fsS --max-time 2 http://127.0.0.1:9222/json/list > "/tmp/rea-evidence/$name-targets.json"; then
                ready=1
                break
              fi
              sleep 1
            done
            if [ "$ready" -eq 1 ]; then
              sleep 5
              target="$(jq -r '[.[]|select(.type=="page")|.id][0] // empty' "/tmp/rea-evidence/$name-targets.json")"
              echo "REA_BROWSER_TARGET=$name:${target:+found}"
              if [ -n "$target" ] && timeout 40 npx --yes rea-agents@6.7.0 inspect-web-page http://127.0.0.1:9222 "$target" --observation-ms 1000 --json > "/tmp/rea-evidence/$name-web.json" 2> "/tmp/rea-evidence/$name-web.stderr"; then
                echo "REA_WEB_OK=$name"
                jq -c '{operation,confidence,authority,subject,normalized_result_keys:(.normalized_result|keys),limitations}' "/tmp/rea-evidence/$name-web.json" | head -c 7000
                echo
                echo "REA_WEB_OBSERVATIONS=$name:"
                jq -c '{target:.normalized_result.target,metadata:.normalized_result.metadata,dom:(.normalized_result.dom|{node_count:(.nodes|length),frame_count:(.frames|length)}),script_count:(.normalized_result.scripts|length),resource_count:(.normalized_result.resources|length),network_keys:(.normalized_result.network|keys),completeness:.normalized_result.completeness}' "/tmp/rea-evidence/$name-web.json" | head -c 9000
                echo
              else
                echo "REA_WEB_FAILED=$name"
                head -c 1600 "/tmp/rea-evidence/$name-web.stderr"
                echo
              fi
            else
              echo "REA_BROWSER_UNAVAILABLE=$name DevTools endpoint not ready"
            fi
            kill "$chrome_pid" 2>/dev/null || true
            wait "$chrome_pid" 2>/dev/null || true
            pkill -f "rea-$name-profile" 2>/dev/null || true
            echo "::endgroup::"
          done
      - name: Store inspectable REA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coach-math-rea-6-7-0
          path: /tmp/rea-evidence/*
          if-no-files-found: warn
          retention-days: 7
