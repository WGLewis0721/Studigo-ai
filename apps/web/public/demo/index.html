<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Studigo demo</title>
  <meta name="robots" content="noindex">
  <script>if (!new URLSearchParams(location.search).has("embed")) location.replace(location.pathname + "?embed");</script>
  <meta name="theme-color" content="#1fc3b6">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="studigo.css">
  <link rel="stylesheet" href="companion.css">
  <link rel="stylesheet" href="flows.css">
</head>
<body>
<main class="stage">
  <div class="deviceWrap">
    <div class="device">
      <div class="screen" id="screen">
        <div class="statusBar" aria-hidden="true">
          <span>9:41</span>
          <span>
            <svg width="18" height="12" viewBox="0 0 18 12"><g fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.500" width="3" height="6.500" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
            <svg width="17" height="12" viewBox="0 0 17 12"><path fill="currentColor" d="M8.500 2.300c2.300 0 4.400.900 6 2.400l1.100-1.200A10.300 10.300 0 0 0 8.500.600C5.800.600 3.300 1.700 1.400 3.500l1.100 1.200c1.600-1.500 3.700-2.400 6-2.400Zm0 3.500c1.400 0 2.700.500 3.700 1.400l1.100-1.200a7.100 7.100 0 0 0-9.600 0l1.100 1.200c1-.900 2.300-1.400 3.700-1.400Zm0 3.400c-.700 0-1.300.300-1.800.700l1.800 1.900 1.800-1.900c-.500-.400-1.100-.700-1.800-.700Z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".500" y=".500" width="22" height="12" rx="3.500" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="19" height="9" rx="2.200" fill="currentColor"/><rect x="24" y="4.200" width="2" height="4.600" rx="1" fill="currentColor" opacity=".45"/></svg>
          </span>
        </div>
        <div class="island" aria-hidden="true"></div>

        <div class="roomDevice" data-shell="teal" data-tone="teal">
          <div class="roomWorkspace" id="workspace" data-tone="coach">
            <header class="workspaceTopbar">
              <button class="roomBackButton" type="button" aria-label="All rooms" data-act="home"><span aria-hidden="true">‹</span></button>
              <div class="workspaceTitle"><i class="roomGem" data-tone="teal" aria-hidden="true"></i><strong>Science</strong></div>
              <div class="topbarRight">
                <button class="topbarRound" type="button" aria-label="Download study guide" data-act="noop"><span aria-hidden="true">↓</span></button>
                <button class="topbarRound iconButton" type="button" aria-label="Room settings" data-act="noop">•••</button>
              </div>
            </header>
            <div class="modeFrame" id="frame"></div>
            <div class="mhChipBar" id="chips"></div>
            <div class="modeSurface" id="surface"></div>
            <nav class="studyGroups" id="tabs" aria-label="Study Room sections"></nav>
          </div>
        </div>

        <div class="view homeView" id="homeView" data-tone="tangerine"></div>
        <div class="view obView" id="obView" data-tone="teal"></div>

        <div class="kbd" id="kbd" aria-hidden="true"></div>
        <div class="homeBar" aria-hidden="true"></div>
      </div>
    </div>
  </div>

</main>
<script src="companion.js"></script>
<script src="app.js"></script>
<script src="flows.js"></script>
</body>
</html>
